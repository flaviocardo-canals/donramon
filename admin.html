<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Don Ramón Pâtisserie · Administración</title>

    <style>
        :root {
            --brown: #7b3714;
            --brown-dark: #5e260b;
            --cream: #fbf5ee;
            --ink: #33261f;
            --border: #d9bfa5;
            --success: #39713d;
            --danger: #a33;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font: 14px Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--brown);
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
        }

        header button {
            padding: 8px 14px;
            border: 1px solid white;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
        }

        header button:hover {
            background: rgba(255, 255, 255, .15);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .login-box {
            max-width: 360px;
            margin: 80px auto;
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
        }

        .login-box h2 {
            margin: 0 0 18px;
            color: var(--brown);
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--brown);
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
        }

        .field textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            padding: 9px 16px;
            border: 0;
            border-radius: 8px;
            background: var(--brown);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .btn:hover {
            background: var(--brown-dark);
        }

        .btn-secondary {
            background: white;
            border: 1px solid var(--brown);
            color: var(--brown);
        }

        .btn-secondary:hover {
            background: #f7ead8;
        }

        .btn-danger {
            background: white;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #fbeaea;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-link {
            border: 0;
            background: transparent;
            color: var(--brown);
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            padding: 0;
        }

        .error-text {
            margin-top: 10px;
            color: var(--danger);
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 9px 14px;
            border: 1px solid var(--brown);
            border-radius: 999px;
            background: transparent;
            color: var(--brown);
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--brown);
            color: white;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .panel-card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: white;
            margin-bottom: 18px;
        }

        .panel-card h3 {
            margin: 0 0 14px;
            color: var(--brown);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-row .field {
            flex: 1;
            min-width: 140px;
            margin-bottom: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            color: var(--brown);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .03em;
        }

        tr.inactivo {
            opacity: .5;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-activo {
            background: #e8f4e8;
            color: var(--success);
        }

        .badge-inactivo {
            background: #f0f0f0;
            color: #888;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .producto-row {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .producto-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: #fbf5ee;
            cursor: pointer;
        }

        .producto-header strong {
            color: var(--brown);
        }

        .producto-body {
            display: none;
            padding: 14px;
            border-top: 1px solid var(--border);
        }

        .producto-body.open {
            display: block;
        }

        .load-msg {
            padding: 20px;
            text-align: center;
            color: #88654c;
        }
    </style>
</head>

<body>
    <div id="loginView" class="login-box">
        <h2>Ingreso administrador</h2>

        <div class="field">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" autocomplete="username">
        </div>

        <div class="field">
            <label for="loginPassword">Contraseña</label>
            <input type="password" id="loginPassword" autocomplete="current-password">
        </div>

        <button class="btn" type="button" onclick="login()" style="width:100%">Ingresar</button>

        <p class="error-text" id="loginError" style="display:none"></p>
    </div>

    <div id="adminView" style="display:none">
        <header>
            <h1>Don Ramón Pâtisserie · Administración</h1>
            <button type="button" onclick="logout()">Cerrar sesión</button>
        </header>

        <div class="wrap">
            <div class="tabs">
                <button class="tab-btn active" data-tab="rubros" onclick="selectTab('rubros')">Rubros</button>
                <button class="tab-btn" data-tab="tamanios" onclick="selectTab('tamanios')">Tamaños</button>
                <button class="tab-btn" data-tab="productos" onclick="selectTab('productos')">Productos</button>
                <button class="tab-btn" data-tab="promociones" onclick="selectTab('promociones')">Promociones</button>
            </div>

            <!-- RUBROS -->
            <section class="panel active" id="panel-rubros">
                <div class="panel-card">
                    <h3>
                        <span id="formRubroTitulo">Nuevo rubro</span>
                    </h3>
                    <div class="form-row">
                        <div class="field">
                            <label>Nombre</label>
                            <input type="text" id="rubroNombre">
                        </div>
                        <div class="field">
                            <label>Orden</label>
                            <input type="number" id="rubroOrden" value="0">
                        </div>
                        <button class="btn" type="button" id="btnGuardarRubro" onclick="guardarRubro()">Agregar</button>
                        <button class="btn btn-link" type="button" id="btnCancelarEdicionRubro" style="display:none" onclick="cancelarEdicionRubro()">Cancelar edición</button>
                    </div>
                </div>

                <div class="panel-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Orden</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaRubros">
                            <tr><td colspan="4" class="load-msg">Cargando…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- TAMAÑOS -->
            <section class="panel" id="panel-tamanios">
                <div class="panel-card">
                    <h3>
                        <span id="formTamanioTitulo">Nuevo tamaño</span>
                    </h3>
                    <div class="form-row">
                        <div class="field">
                            <label>Nombre</label>
                            <input type="text" id="tamanioNombre">
                        </div>
                        <button class="btn" type="button" id="btnGuardarTamanio" onclick="guardarTamanio()">Agregar</button>
                        <button class="btn btn-link" type="button" id="btnCancelarEdicionTamanio" style="display:none" onclick="cancelarEdicionTamanio()">Cancelar edición</button>
                    </div>
                </div>

                <div class="panel-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaTamanios">
                            <tr><td colspan="3" class="load-msg">Cargando…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- PRODUCTOS -->
            <section class="panel" id="panel-productos">
                <div class="panel-card">
                    <h3>
                        <span id="formProductoTitulo">Nuevo producto</span>
                    </h3>
                    <div class="form-row">
                        <div class="field">
                            <label>Nombre</label>
                            <input type="text" id="productoNombre">
                        </div>
                        <div class="field">
                            <label>Rubro</label>
                            <select id="productoRubro"></select>
                        </div>
                        <div class="field">
                            <label>Ícono (emoji)</label>
                            <input type="text" id="productoIcono" placeholder="☕" maxlength="4">
                        </div>
                        <div class="field">
                            <label>Estado</label>
                            <select id="productoEstado">
                                <option value="disponible">Disponible</option>
                                <option value="consultar">Consultar</option>
                                <option value="pendiente">Pendiente (no se puede pedir)</option>
                                <option value="sin_stock">Sin stock</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Orden</label>
                            <input type="number" id="productoOrden" value="0">
                        </div>
                    </div>
                    <div class="field" style="margin-top:10px">
                        <label>Descripción</label>
                        <textarea id="productoDescripcion"></textarea>
                    </div>
                    <div style="margin-top:10px; display:flex; gap:10px">
                        <button class="btn" type="button" id="btnGuardarProducto" onclick="guardarProducto()">
                            Agregar producto
                        </button>
                        <button class="btn btn-link" type="button" id="btnCancelarEdicionProducto" style="display:none" onclick="cancelarEdicionProducto()">
                            Cancelar edición
                        </button>
                    </div>
                </div>

                <div class="panel-card">
                    <h3>Productos cargados</h3>
                    <div class="productos-list" id="listaProductos">
                        <p class="load-msg">Cargando…</p>
                    </div>
                </div>
            </section>

            <!-- PROMOCIONES -->
            <section class="panel" id="panel-promociones">
                <div class="panel-card">
                    <h3>
                        <span id="formPromoTitulo">Nueva promoción</span>
                    </h3>
                    <div class="form-row">
                        <div class="field">
                            <label>Nombre</label>
                            <input type="text" id="promoNombre" placeholder="Ej: Combo 1: Café + Cookie">
                        </div>
                        <div class="field">
                            <label>Precio del combo</label>
                            <input type="number" step="0.01" id="promoPrecio">
                        </div>
                    </div>
                    <div class="form-row" style="margin-top:10px">
                        <div class="field">
                            <label>Vigente desde (opcional)</label>
                            <input type="date" id="promoFechaDesde">
                        </div>
                        <div class="field">
                            <label>Vigente hasta (opcional)</label>
                            <input type="date" id="promoFechaHasta">
                        </div>
                    </div>
                    <div class="field" style="margin-top:10px">
                        <label>Descripción</label>
                        <textarea id="promoDescripcion"></textarea>
                    </div>
                    <div style="margin-top:10px; display:flex; gap:10px">
                        <button class="btn" type="button" id="btnGuardarPromo" onclick="guardarPromo()">
                            Crear promoción
                        </button>
                        <button class="btn btn-link" type="button" id="btnCancelarEdicionPromo" style="display:none" onclick="cancelarEdicionPromo()">
                            Cancelar edición
                        </button>
                    </div>
                </div>

                <div class="panel-card">
                    <h3>Promociones cargadas</h3>
                    <div id="listaPromociones">
                        <p class="load-msg">Cargando…</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ⚠️ Completar con los mismos datos que en index.html
        const SUPABASE_URL = 'TU_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY_AQUI';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let rubrosCache = [];
        let tamaniosCache = [];
        let productosCache = [];
        let productoPreciosCache = [];
        let promocionesCache = [];

        /* ---------- Auth ---------- */

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            errorEl.style.display = 'none';

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = 'No se pudo ingresar: ' + error.message;
                errorEl.style.display = 'block';
                return;
            }

            mostrarAdmin();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('adminView').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
        }

        async function mostrarAdmin() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('adminView').style.display = 'block';

            await cargarRubros();
            await cargarTamanios();
            await cargarProductoPreciosParaSelect();
            await cargarProductos();
            await cargarPromociones();
        }

        async function checkSesionInicial() {
            const { data } = await supabaseClient.auth.getSession();

            if (data.session) {
                mostrarAdmin();
            }
        }

        /* ---------- Tabs ---------- */

        function selectTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            document.querySelectorAll('.panel').forEach(panel => {
                panel.classList.toggle('active', panel.id === 'panel-' + tab);
            });
        }

        /* ---------- Rubros ---------- */

        async function cargarRubros() {
            const { data, error } = await supabaseClient
                .from('rubros')
                .select('*')
                .order('orden', { ascending: true });

            if (error) {
                console.error(error);
                return;
            }

            rubrosCache = data;
            renderTablaRubros();
            renderSelectRubros();
        }

        function renderTablaRubros() {
            document.getElementById('tablaRubros').innerHTML = rubrosCache.map(rubro => `
                <tr class="${rubro.bcondicion ? '' : 'inactivo'}">
                    <td>${escapeHtml(rubro.nombre)}</td>
                    <td>${rubro.orden}</td>
                    <td>
                        <span class="badge ${rubro.bcondicion ? 'badge-activo' : 'badge-inactivo'}">
                            ${rubro.bcondicion ? 'Activo' : 'Inactivo'}
                        </span>
                    </td>
                    <td class="actions-cell">
                        <button class="btn btn-sm btn-secondary" onclick="iniciarEdicionRubro(rubrosCache.find(r => r.id === ${rubro.id}))">
                            Modificar
                        </button>
                        <button class="btn btn-sm btn-secondary" onclick="toggleCondicion('rubros', ${rubro.id}, ${!rubro.bcondicion}, cargarRubros)">
                            ${rubro.bcondicion ? 'Dar de baja' : 'Reactivar'}
                        </button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="load-msg">No hay rubros cargados.</td></tr>';
        }

        function renderSelectRubros() {
            const select = document.getElementById('productoRubro');
            select.innerHTML = rubrosCache
                .filter(rubro => rubro.bcondicion)
                .map(rubro => `<option value="${rubro.id}">${escapeHtml(rubro.nombre)}</option>`)
                .join('');
        }

        let editingRubroId = null;

        function iniciarEdicionRubro(rubro) {
            editingRubroId = rubro.id;
            document.getElementById('rubroNombre').value = rubro.nombre;
            document.getElementById('rubroOrden').value = rubro.orden;
            document.getElementById('formRubroTitulo').textContent = 'Editando: ' + rubro.nombre;
            document.getElementById('btnGuardarRubro').textContent = 'Guardar cambios';
            document.getElementById('btnCancelarEdicionRubro').style.display = 'inline-block';
        }

        function cancelarEdicionRubro() {
            editingRubroId = null;
            document.getElementById('rubroNombre').value = '';
            document.getElementById('rubroOrden').value = '0';
            document.getElementById('formRubroTitulo').textContent = 'Nuevo rubro';
            document.getElementById('btnGuardarRubro').textContent = 'Agregar';
            document.getElementById('btnCancelarEdicionRubro').style.display = 'none';
        }

        async function guardarRubro() {
            const nombre = document.getElementById('rubroNombre').value.trim();
            const orden = Number(document.getElementById('rubroOrden').value) || 0;

            if (!nombre) {
                alert('Ingresá un nombre.');
                return;
            }

            const { error } = editingRubroId
                ? await supabaseClient.from('rubros').update({ nombre, orden }).eq('id', editingRubroId)
                : await supabaseClient.from('rubros').insert({ nombre, orden });

            if (error) {
                alert('No se pudo guardar: ' + error.message);
                return;
            }

            cancelarEdicionRubro();
            await cargarRubros();
        }

        /* ---------- Tamaños ---------- */

        async function cargarTamanios() {
            const { data, error } = await supabaseClient
                .from('tamanios')
                .select('*')
                .order('nombre', { ascending: true });

            if (error) {
                console.error(error);
                return;
            }

            tamaniosCache = data;
            renderTablaTamanios();
        }

        function renderTablaTamanios() {
            document.getElementById('tablaTamanios').innerHTML = tamaniosCache.map(tamanio => `
                <tr class="${tamanio.bcondicion ? '' : 'inactivo'}">
                    <td>${escapeHtml(tamanio.nombre)}</td>
                    <td>
                        <span class="badge ${tamanio.bcondicion ? 'badge-activo' : 'badge-inactivo'}">
                            ${tamanio.bcondicion ? 'Activo' : 'Inactivo'}
                        </span>
                    </td>
                    <td class="actions-cell">
                        <button class="btn btn-sm btn-secondary" onclick="iniciarEdicionTamanio(tamaniosCache.find(t => t.id === ${tamanio.id}))">
                            Modificar
                        </button>
                        <button class="btn btn-sm btn-secondary" onclick="toggleCondicion('tamanios', ${tamanio.id}, ${!tamanio.bcondicion}, cargarTamanios)">
                            ${tamanio.bcondicion ? 'Dar de baja' : 'Reactivar'}
                        </button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="3" class="load-msg">No hay tamaños cargados.</td></tr>';
        }

        let editingTamanioId = null;

        function iniciarEdicionTamanio(tamanio) {
            editingTamanioId = tamanio.id;
            document.getElementById('tamanioNombre').value = tamanio.nombre;
            document.getElementById('formTamanioTitulo').textContent = 'Editando: ' + tamanio.nombre;
            document.getElementById('btnGuardarTamanio').textContent = 'Guardar cambios';
            document.getElementById('btnCancelarEdicionTamanio').style.display = 'inline-block';
        }

        function cancelarEdicionTamanio() {
            editingTamanioId = null;
            document.getElementById('tamanioNombre').value = '';
            document.getElementById('formTamanioTitulo').textContent = 'Nuevo tamaño';
            document.getElementById('btnGuardarTamanio').textContent = 'Agregar';
            document.getElementById('btnCancelarEdicionTamanio').style.display = 'none';
        }

        async function guardarTamanio() {
            const nombre = document.getElementById('tamanioNombre').value.trim();

            if (!nombre) {
                alert('Ingresá un nombre.');
                return;
            }

            const { error } = editingTamanioId
                ? await supabaseClient.from('tamanios').update({ nombre }).eq('id', editingTamanioId)
                : await supabaseClient.from('tamanios').insert({ nombre });

            if (error) {
                alert('No se pudo guardar: ' + error.message);
                return;
            }

            cancelarEdicionTamanio();
            await cargarTamanios();
        }

        /* ---------- Productos + precios/variantes ---------- */

        async function cargarProductoPreciosParaSelect() {
            const { data, error } = await supabaseClient
                .from('producto_precios')
                .select('id, precio, producto:productos ( nombre ), tamanio:tamanios ( nombre )')
                .eq('bcondicion', true)
                .order('id');

            if (error) {
                console.error(error);
                productoPreciosCache = [];
                return;
            }

            productoPreciosCache = data;
        }

        async function cargarProductos() {
            const { data, error } = await supabaseClient
                .from('productos')
                .select(`
                    *,
                    rubro:rubros ( nombre ),
                    precios:producto_precios ( id, precio, stock, bcondicion, tamanio:tamanios ( id, nombre ) )
                `)
                .order('orden', { ascending: true });

            if (error) {
                console.error(error);
                document.getElementById('listaProductos').innerHTML =
                    '<p class="load-msg">No se pudieron cargar los productos.</p>';
                return;
            }

            productosCache = data;
            renderListaProductos();
        }

        function renderListaProductos() {
            const contenedor = document.getElementById('listaProductos');

            if (productosCache.length === 0) {
                contenedor.innerHTML = '<p class="load-msg">Todavía no hay productos cargados.</p>';
                return;
            }

            contenedor.innerHTML = productosCache.map(producto => `
                <div class="producto-row">
                    <div class="producto-header" onclick="toggleProducto(${producto.id})">
                        <span>
                            ${producto.icono || ''}
                            <strong>${escapeHtml(producto.nombre)}</strong>
                            — ${escapeHtml(producto.rubro ? producto.rubro.nombre : 'Sin rubro')}
                        </span>
                        <span class="badge ${producto.bcondicion ? 'badge-activo' : 'badge-inactivo'}">
                            ${producto.bcondicion ? 'Activo' : 'Inactivo'}
                        </span>
                    </div>

                    <div class="producto-body" id="producto-body-${producto.id}">
                        <div class="form-row" style="margin-bottom:14px">
                            <button class="btn btn-sm btn-secondary" onclick="iniciarEdicionProducto(productosCache.find(p => p.id === ${producto.id}))">
                                Modificar
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="toggleCondicion('productos', ${producto.id}, ${!producto.bcondicion}, cargarProductos)">
                                ${producto.bcondicion ? 'Dar de baja producto' : 'Reactivar producto'}
                            </button>
                        </div>

                        <p><strong>Estado:</strong> ${escapeHtml(producto.estado)}</p>
                        <p><strong>Descripción:</strong> ${escapeHtml(producto.descripcion || '—')}</p>

                        <h4 style="color:var(--brown)">Precios / variantes</h4>

                        <table>
                            <thead>
                                <tr>
                                    <th>Tamaño</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(producto.precios || []).map(precio => `
                                    <tr class="${precio.bcondicion ? '' : 'inactivo'}">
                                        <td>${precio.tamanio ? escapeHtml(precio.tamanio.nombre) : 'Único'}</td>
                                        <td>$${precio.precio}</td>
                                        <td>${precio.stock === null ? 'Sin control' : precio.stock}</td>
                                        <td>
                                            <span class="badge ${precio.bcondicion ? 'badge-activo' : 'badge-inactivo'}">
                                                ${precio.bcondicion ? 'Activo' : 'Inactivo'}
                                            </span>
                                        </td>
                                        <td class="actions-cell">
                                            <button class="btn btn-sm btn-secondary" onclick="editarVariante(${precio.id}, ${precio.precio}, ${precio.stock === null ? 'null' : precio.stock})">
                                                Editar precio/stock
                                            </button>
                                            <button class="btn btn-sm btn-secondary" onclick="toggleCondicion('producto_precios', ${precio.id}, ${!precio.bcondicion}, cargarProductos)">
                                                ${precio.bcondicion ? 'Baja' : 'Reactivar'}
                                            </button>
                                        </td>
                                    </tr>
                                `).join('') || '<tr><td colspan="5">Sin variantes cargadas.</td></tr>'}
                            </tbody>
                        </table>

                        <div class="form-row" style="margin-top:14px">
                            <div class="field">
                                <label>Tamaño (opcional)</label>
                                <select id="nuevoTamanio-${producto.id}">
                                    <option value="">Único (sin tamaño)</option>
                                    ${tamaniosCache.filter(t => t.bcondicion).map(t =>
                                        `<option value="${t.id}">${escapeHtml(t.nombre)}</option>`
                                    ).join('')}
                                </select>
                            </div>
                            <div class="field">
                                <label>Precio</label>
                                <input type="number" step="0.01" id="nuevoPrecio-${producto.id}">
                            </div>
                            <div class="field">
                                <label>Stock (vacío = sin control)</label>
                                <input type="number" id="nuevoStock-${producto.id}">
                            </div>
                            <button class="btn btn-sm" onclick="agregarVariante(${producto.id})">
                                Agregar variante
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleProducto(id) {
            document.getElementById('producto-body-' + id).classList.toggle('open');
        }

        let editingProductoId = null;

        function iniciarEdicionProducto(producto) {
            editingProductoId = producto.id;

            document.getElementById('productoNombre').value = producto.nombre;
            document.getElementById('productoRubro').value = producto.rubro_id;
            document.getElementById('productoIcono').value = producto.icono || '';
            document.getElementById('productoEstado').value = producto.estado;
            document.getElementById('productoOrden').value = producto.orden;
            document.getElementById('productoDescripcion').value = producto.descripcion || '';

            document.getElementById('formProductoTitulo').textContent = 'Editando: ' + producto.nombre;
            document.getElementById('btnGuardarProducto').textContent = 'Guardar cambios';
            document.getElementById('btnCancelarEdicionProducto').style.display = 'inline-block';

            document.getElementById('panel-productos').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cancelarEdicionProducto() {
            editingProductoId = null;

            document.getElementById('productoNombre').value = '';
            document.getElementById('productoIcono').value = '';
            document.getElementById('productoEstado').value = 'disponible';
            document.getElementById('productoOrden').value = '0';
            document.getElementById('productoDescripcion').value = '';

            document.getElementById('formProductoTitulo').textContent = 'Nuevo producto';
            document.getElementById('btnGuardarProducto').textContent = 'Agregar producto';
            document.getElementById('btnCancelarEdicionProducto').style.display = 'none';
        }

        async function guardarProducto() {
            const nombre = document.getElementById('productoNombre').value.trim();
            const rubro_id = document.getElementById('productoRubro').value;
            const icono = document.getElementById('productoIcono').value.trim() || '🍽️';
            const estado = document.getElementById('productoEstado').value;
            const orden = Number(document.getElementById('productoOrden').value) || 0;
            const descripcion = document.getElementById('productoDescripcion').value.trim();

            if (!nombre || !rubro_id) {
                alert('Completá al menos el nombre y el rubro.');
                return;
            }

            const payload = { nombre, rubro_id, icono, estado, orden, descripcion };

            const { error } = editingProductoId
                ? await supabaseClient.from('productos').update(payload).eq('id', editingProductoId)
                : await supabaseClient.from('productos').insert(payload);

            if (error) {
                alert('No se pudo guardar: ' + error.message);
                return;
            }

            cancelarEdicionProducto();
            await cargarProductos();
        }

        async function agregarVariante(productoId) {
            const tamanioId = document.getElementById('nuevoTamanio-' + productoId).value || null;
            const precio = Number(document.getElementById('nuevoPrecio-' + productoId).value);
            const stockRaw = document.getElementById('nuevoStock-' + productoId).value;
            const stock = stockRaw === '' ? null : Number(stockRaw);

            if (!precio || precio <= 0) {
                alert('Ingresá un precio válido.');
                return;
            }

            const { error } = await supabaseClient.from('producto_precios').insert({
                producto_id: productoId,
                tamanio_id: tamanioId,
                precio,
                stock
            });

            if (error) {
                alert('No se pudo agregar la variante: ' + error.message);
                return;
            }

            await cargarProductos();
            await cargarProductoPreciosParaSelect();
            document.getElementById('producto-body-' + productoId)?.classList.add('open');
        }

        async function editarVariante(precioId, precioActual, stockActual) {
            const nuevoPrecioRaw = prompt('Nuevo precio:', precioActual);
            if (nuevoPrecioRaw === null) return;

            const nuevoPrecio = Number(nuevoPrecioRaw);
            if (!nuevoPrecio || nuevoPrecio <= 0) {
                alert('Precio inválido.');
                return;
            }

            const nuevoStockRaw = prompt(
                'Nuevo stock (dejar vacío para "sin control"):',
                stockActual === null ? '' : stockActual
            );
            if (nuevoStockRaw === null) return;

            const nuevoStock = nuevoStockRaw.trim() === '' ? null : Number(nuevoStockRaw);

            const { error } = await supabaseClient
                .from('producto_precios')
                .update({ precio: nuevoPrecio, stock: nuevoStock })
                .eq('id', precioId);

            if (error) {
                alert('No se pudo actualizar: ' + error.message);
                return;
            }

            await cargarProductos();
            await cargarProductoPreciosParaSelect();
        }

        /* ---------- Promociones ---------- */

        async function cargarPromociones() {
            const { data, error } = await supabaseClient
                .from('promociones')
                .select(`
                    *,
                    items:promocion_items (
                        id, cantidad,
                        producto_precio: producto_precios ( id, precio, producto:productos ( nombre ), tamanio:tamanios ( nombre ) )
                    )
                `)
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                document.getElementById('listaPromociones').innerHTML =
                    '<p class="load-msg">No se pudieron cargar las promociones.</p>';
                return;
            }

            promocionesCache = data;
            renderListaPromociones();
        }

        function renderListaPromociones() {
            const contenedor = document.getElementById('listaPromociones');

            if (promocionesCache.length === 0) {
                contenedor.innerHTML = '<p class="load-msg">Todavía no hay promociones cargadas.</p>';
                return;
            }

            contenedor.innerHTML = promocionesCache.map(promo => `
                <div class="producto-row">
                    <div class="producto-header" onclick="togglePromo(${promo.id})">
                        <span><strong>${escapeHtml(promo.nombre)}</strong> — $${promo.precio}</span>
                        <span class="badge ${promo.bcondicion ? 'badge-activo' : 'badge-inactivo'}">
                            ${promo.bcondicion ? 'Activa' : 'Inactiva'}
                        </span>
                    </div>

                    <div class="producto-body" id="promo-body-${promo.id}">
                        <div class="form-row" style="margin-bottom:14px">
                            <button class="btn btn-sm btn-secondary" onclick="iniciarEdicionPromo(promocionesCache.find(p => p.id === ${promo.id}))">
                                Modificar
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="toggleCondicion('promociones', ${promo.id}, ${!promo.bcondicion}, cargarPromociones)">
                                ${promo.bcondicion ? 'Dar de baja' : 'Reactivar'}
                            </button>
                        </div>

                        <p><strong>Descripción:</strong> ${escapeHtml(promo.descripcion || '—')}</p>
                        <p><strong>Vigencia:</strong> ${promo.fecha_desde || 'sin inicio'} a ${promo.fecha_hasta || 'sin fin'}</p>

                        <h4 style="color:var(--brown)">Productos que incluye</h4>

                        <table>
                            <thead>
                                <tr><th>Producto</th><th>Cantidad</th><th>Acciones</th></tr>
                            </thead>
                            <tbody>
                                ${(promo.items || []).map(item => `
                                    <tr>
                                        <td>${escapeHtml(item.producto_precio.producto.nombre)}${item.producto_precio.tamanio ? ' - ' + escapeHtml(item.producto_precio.tamanio.nombre) : ''}</td>
                                        <td>${item.cantidad}</td>
                                        <td>
                                            <button class="btn btn-sm btn-danger" onclick="quitarItemPromo(${item.id}, ${promo.id})">Quitar</button>
                                        </td>
                                    </tr>
                                `).join('') || '<tr><td colspan="3">Sin productos asignados.</td></tr>'}
                            </tbody>
                        </table>

                        <div class="form-row" style="margin-top:14px">
                            <div class="field">
                                <label>Producto</label>
                                <select id="nuevoItemProducto-${promo.id}">
                                    ${productoPreciosCache.map(pp => `
                                        <option value="${pp.id}">
                                            ${escapeHtml(pp.producto.nombre)}${pp.tamanio ? ' - ' + escapeHtml(pp.tamanio.nombre) : ''} ($${pp.precio})
                                        </option>
                                    `).join('')}
                                </select>
                            </div>
                            <div class="field">
                                <label>Cantidad</label>
                                <input type="number" id="nuevoItemCantidad-${promo.id}" value="1" min="1">
                            </div>
                            <button class="btn btn-sm" onclick="agregarItemPromo(${promo.id})">Agregar producto</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function togglePromo(id) {
            document.getElementById('promo-body-' + id).classList.toggle('open');
        }

        let editingPromoId = null;

        function iniciarEdicionPromo(promo) {
            editingPromoId = promo.id;

            document.getElementById('promoNombre').value = promo.nombre;
            document.getElementById('promoDescripcion').value = promo.descripcion || '';
            document.getElementById('promoPrecio').value = promo.precio;
            document.getElementById('promoFechaDesde').value = promo.fecha_desde || '';
            document.getElementById('promoFechaHasta').value = promo.fecha_hasta || '';

            document.getElementById('formPromoTitulo').textContent = 'Editando: ' + promo.nombre;
            document.getElementById('btnGuardarPromo').textContent = 'Guardar cambios';
            document.getElementById('btnCancelarEdicionPromo').style.display = 'inline-block';

            document.getElementById('panel-promociones').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cancelarEdicionPromo() {
            editingPromoId = null;

            document.getElementById('promoNombre').value = '';
            document.getElementById('promoDescripcion').value = '';
            document.getElementById('promoPrecio').value = '';
            document.getElementById('promoFechaDesde').value = '';
            document.getElementById('promoFechaHasta').value = '';

            document.getElementById('formPromoTitulo').textContent = 'Nueva promoción';
            document.getElementById('btnGuardarPromo').textContent = 'Crear promoción';
            document.getElementById('btnCancelarEdicionPromo').style.display = 'none';
        }

        async function guardarPromo() {
            const nombre = document.getElementById('promoNombre').value.trim();
            const descripcion = document.getElementById('promoDescripcion').value.trim();
            const precio = Number(document.getElementById('promoPrecio').value);
            const fecha_desde = document.getElementById('promoFechaDesde').value || null;
            const fecha_hasta = document.getElementById('promoFechaHasta').value || null;

            if (!nombre || !precio || precio <= 0) {
                alert('Completá al menos el nombre y un precio válido.');
                return;
            }

            const payload = { nombre, descripcion, precio, fecha_desde, fecha_hasta };

            const { error } = editingPromoId
                ? await supabaseClient.from('promociones').update(payload).eq('id', editingPromoId)
                : await supabaseClient.from('promociones').insert(payload);

            if (error) {
                alert('No se pudo guardar: ' + error.message);
                return;
            }

            cancelarEdicionPromo();
            await cargarPromociones();
        }

        async function agregarItemPromo(promoId) {
            const producto_precio_id = document.getElementById('nuevoItemProducto-' + promoId).value;
            const cantidad = Number(document.getElementById('nuevoItemCantidad-' + promoId).value) || 1;

            if (!producto_precio_id) {
                alert('No hay productos con precio activo para agregar. Cargá primero un producto con su precio.');
                return;
            }

            const { error } = await supabaseClient.from('promocion_items').insert({
                promocion_id: promoId,
                producto_precio_id,
                cantidad
            });

            if (error) {
                alert('No se pudo agregar: ' + error.message);
                return;
            }

            await cargarPromociones();
            document.getElementById('promo-body-' + promoId)?.classList.add('open');
        }

        async function quitarItemPromo(itemId, promoId) {
            if (!confirm('¿Quitar este producto de la promoción?')) return;

            const { error } = await supabaseClient.from('promocion_items').delete().eq('id', itemId);

            if (error) {
                alert('No se pudo quitar: ' + error.message);
                return;
            }

            await cargarPromociones();
            document.getElementById('promo-body-' + promoId)?.classList.add('open');
        }

        /* ---------- Alta/baja genérica ---------- */

        async function toggleCondicion(tabla, id, nuevoValor, recargar) {
            const { error } = await supabaseClient
                .from(tabla)
                .update({ bcondicion: nuevoValor })
                .eq('id', id);

            if (error) {
                alert('No se pudo actualizar: ' + error.message);
                return;
            }

            if (typeof recargar === 'function') {
                await recargar();
            }
        }

        /* ---------- Utilidades ---------- */

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        checkSesionInicial();
    </script>
</body>

</html>
